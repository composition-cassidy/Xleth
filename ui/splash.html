<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>XLETH — Splash Screen</title>
<!--
  XLETH SPLASH SCREEN
  ===================
  One flat surface from the workspace's own neutral ramp (ui/DESIGN.md
  section 3): no gradients, no textures, no decorative shapes. The one
  designed element is the progress bar, drawn as a bar/beat ruler with a
  playhead, because that is XLETH's own world and it carries real data.

  This window renders before ThemeProvider exists, so the tokens below are a
  frozen copy of the workspace dark defaults. Components only reference
  var(--*); no colour literal appears outside :root. Offline-safe: system
  fonts only, no external requests; xleth.svg must sit beside this file.

  [INTEGRATE] points are marked in the script.
-->
<style>
  :root {
    --g0: #141414;
    --g1: #1b1b1b;
    --g4: #3a3a3a;
    --boundary: #747474;
    --ink: #e6e6e6;
    --ink-2: #b4b4b4;
    --ink-3: #929292;   /* dimmest text allowed: 5.5:1 on g1 */
    --value: #33ced6;   /* default accent */
    --backdrop: #050505; /* browser-preview backdrop only; the real window is the card */
    --font: "Barlow", "Inter", "Noto Sans", "Segoe UI", system-ui, sans-serif;
    --splash-w: 640px;
    --splash-h: 400px;
    --pad: 40px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--backdrop);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .splash {
    position: relative;
    width: var(--splash-w); height: var(--splash-h);
    overflow: hidden;
    background: var(--g1);
    /* a frameless window has no edge of its own against a dark desktop */
    border: 1px solid var(--g4);
    display: flex; flex-direction: column;
    padding: var(--pad);
  }

  /* ---- identity ---- */
  /* xleth.svg has ~38% empty headroom in its viewBox; the crop box trims it
     so the wordmark sits tight. Width drives height. */
  .logo-crop { width: 300px; height: 99px; overflow: hidden; }
  .logo-crop img {
    width: 300px; display: block; margin-top: -60px;
    /* SVG paths carry no fill and render black; force the white wordmark. */
    filter: brightness(0) invert(1);
  }
  .tagline { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .dedication { margin-top: 4px; font-size: 12px; color: var(--ink-3); }

  /* ---- boot status: label, then the ruler ---- */
  .boot { margin-top: auto; }
  .status-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    margin-bottom: 8px;
  }
  .status-text {
    font-size: 12px; color: var(--ink-2);
    min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-pct { flex: none; font-size: 12px; color: var(--ink-3); }

  /* The progress bar as a ruler: a bar line every 8 divisions, a beat line
     every division, a baseline that fills with progress, and a playhead at
     the current position. Real progress, not decoration. */
  .ruler {
    position: relative;
    height: 20px;
    --divisions: 32;
    background:
      linear-gradient(var(--boundary), var(--boundary)) left bottom / 100% 1px no-repeat,
      linear-gradient(to right, var(--boundary) 1px, transparent 1px) left bottom / calc(100% / 4) 12px repeat-x,
      linear-gradient(to right, var(--g4) 1px, transparent 1px) left bottom / calc(100% / var(--divisions)) 6px repeat-x;
    border-right: 1px solid var(--boundary);
  }
  .ruler-fill {
    position: absolute; left: 0; bottom: 0;
    height: 2px; width: 0%;
    background: var(--value);
    transition: width 0.45s ease;
  }
  .ruler-head {
    position: absolute; bottom: 0; left: 0;
    width: 1px; height: 20px;
    background: var(--value);
    transition: left 0.45s ease;
  }

  .meta-row {
    display: flex; justify-content: flex-end;
    margin-top: 12px;
    font-size: 11px; color: var(--ink-3);
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="logo-crop">
      <!-- xleth.svg sits beside this HTML file -->
      <img src="xleth.svg" alt="XLETH">
    </div>
    <div class="tagline">The YTPMVer's DAW</div>
    <div class="dedication">In honor of Adubuyrus</div>

    <div class="boot">
      <div class="status-row">
        <div class="status-text" id="statusText" role="status" aria-live="polite">Starting&hellip;</div>
        <div class="status-pct" id="statusPct">0 %</div>
      </div>
      <div class="ruler" id="ruler" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ruler-fill" id="rulerFill"></div>
        <div class="ruler-head" id="rulerHead"></div>
      </div>
      <div class="meta-row"><span id="versionLabel">Version 1.2.2-beta 64-bit</span></div>
    </div>
  </div>

<script>
  /*
    [INTEGRATE] Version auto-alignment with build-portable.bat.
    build-portable.bat already passes the typed version to electron-builder
    via --config.extraMetadata.version=%XLETH_VERSION%, so the packaged
    app's app.getVersion() IS the version Krasen typed. electron-main just
    forwards it to this window via the `v` query param.
  */
  const versionLabel = document.getElementById('versionLabel');
  const versionParam = new URLSearchParams(window.location.search).get('v');
  versionLabel.textContent = 'Version ' + (versionParam || '1.2.2-beta') + ' 64-bit';

  const statusText = document.getElementById('statusText');
  const statusPct = document.getElementById('statusPct');
  const ruler = document.getElementById('ruler');
  const rulerFill = document.getElementById('rulerFill');
  const rulerHead = document.getElementById('rulerHead');

  function setStatus(message) { statusText.textContent = message; }
  function setProgress(percent) {
    const p = Math.max(0, Math.min(100, percent));
    rulerFill.style.width = p + '%';
    rulerHead.style.left = 'calc(' + p + '% - ' + (p >= 100 ? 1 : 0) + 'px)';
    // thin space before the unit, per the workspace value format
    statusPct.textContent = Math.round(p) + ' %';
    ruler.setAttribute('aria-valuenow', String(Math.round(p)));
  }

  // Public surface of the splash window. electron-main drives this with real
  // startup milestones through splash-preload.js (see window.splashStatus
  // calls wired to the 'splash:status' IPC channel).
  window.splashStatus = function (message, percent) {
    if (message != null) setStatus(message);
    if (percent != null) setProgress(percent);
  };

  // Demo messages, kept as fallback text for standalone preview only (no
  // splash-preload.js present, e.g. opening this file directly in a browser).
  // The packaged app never runs this loop — window.__xlethSplashPreloadActive
  // is set by the preload before this script runs.
  const bootSequence = [
    ['Loading audio engine…',          14],
    ['Starting compositor…',           32],
    ['Scanning VST3 plugins…',         55],
    ['Updating plug-in cache…',        71],
    ['Restoring session…',             88],
    ['Ready.',                        100],
  ];

  if (!window.__xlethSplashPreloadActive) {
    let step = 0;
    (function advance() {
      const [message, target] = bootSequence[step];
      window.splashStatus(message, target);
      step++;
      if (step < bootSequence.length) {
        setTimeout(advance, 900);
      } else {
        // demo loop restart — real build closes the splash here instead
        setTimeout(() => { step = 0; setProgress(0); setTimeout(advance, 400); }, 1600);
      }
    })();
  }
</script>

</body>
</html>
