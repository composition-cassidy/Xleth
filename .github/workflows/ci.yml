# Xleth CI — builds all three layers on every PR and push to main.
#
#   native : CMake engine build (engine + scanner + editor-host + test exes),
#            then the Node-API bridge addon via cmake-js. Both must succeed.
#            Uploads the built addon as an artifact for the ui job.
#   ui     : Vite production build + vitest suite (both must succeed). Runs
#            after native: the vitest suite forks ui/addon-worker.js, which
#            requires the addon binary the native job builds.
#
# Local reproduction of each step is documented in CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Engine + bridge (MSVC x64)
    runs-on: windows-2022 # pinned: VS 2022 generator + bundled CMake 3.x are load-bearing
    timeout-minutes: 180 # first run builds FFmpeg from source; cached runs are much faster
    env:
      # Root CMakeLists.txt picks up the vcpkg toolchain from VCPKG_ROOT.
      # GitHub's Windows runners ship a vcpkg clone at C:\vcpkg.
      VCPKG_ROOT: C:\vcpkg
      # Store compiled vcpkg packages (FFmpeg, GLEW, GLFW) in the Actions
      # cache so only the first run on a cold cache pays the FFmpeg build.
      # If the cache backend is unavailable, vcpkg just builds from source.
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

    steps:
      - uses: actions/checkout@v4

      # The build requires the CMake 3.x line. The runner's default CMake is
      # 4.x, which breaks configuration of fetched dependencies that still
      # declare pre-3.5 minimums (same reason local builds use the
      # VS-bundled CMake — see CONTRIBUTING.md). Put Visual Studio's bundled
      # CMake first on PATH for this job and every later step (cmake-js
      # included).
      - name: Use Visual Studio's bundled CMake (3.x)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $cmakeBin = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin'
          if (-not (Test-Path (Join-Path $cmakeBin 'cmake.exe'))) {
            throw "VS-bundled CMake not found at $cmakeBin"
          }
          Add-Content $env:GITHUB_PATH $cmakeBin
          & (Join-Path $cmakeBin 'cmake.exe') --version

      # vcpkg's GitHub-Actions binary cache ("x-gha" above) needs the runner's
      # cache credentials exported as ordinary environment variables.
      - name: Export Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Mirrors `build.bat engine`. Configure installs the vcpkg manifest
      # (FFmpeg/GLEW/GLFW/nlohmann-json) into build/vcpkg_installed and
      # fetches JUCE, Rubber Band, WORLD, and xxHash via FetchContent.
      - name: Configure (CMake + vcpkg manifest)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build engine, scanner, editor-host, tests
        run: cmake --build build --config Release --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Mirrors `build.bat bridge`. The bridge's CMakeLists reuses the vcpkg
      # packages the engine configure step installed into build/vcpkg_installed,
      # so this must run after the engine build (same job, same workspace).
      - name: Install bridge deps
        working-directory: bridge
        run: npm ci

      - name: Build bridge addon (cmake-js)
        working-directory: bridge
        run: npx cmake-js compile --CDCMAKE_BUILD_TYPE=Release

      - name: Verify addon binary exists
        shell: pwsh
        run: |
          $addon = 'bridge\build\Release\xleth_native.node'
          if (-not (Test-Path $addon)) { throw "$addon was not produced" }
          Get-Item $addon | Format-List Name, Length

      # The addon dynamically links FFmpeg (avcodec-62.dll etc.), but nothing
      # in the build copies those DLLs next to it — vcpkg leaves them in
      # build/vcpkg_installed/x64-windows/bin. Without them require() fails
      # with Windows' misleading "The specified module could not be found"
      # even though xleth_native.node itself exists. Copy ALL vcpkg runtime
      # DLLs (not just av*/sw*) so transitive deps like zlib come along.
      - name: Stage vcpkg runtime DLLs next to the addon
        shell: pwsh
        run: |
          $bin = 'build\vcpkg_installed\x64-windows\bin'
          $dlls = Get-ChildItem $bin -Filter '*.dll'
          if (-not $dlls) { throw "no DLLs found in $bin" }
          $dlls | Copy-Item -Destination 'bridge\build\Release\'
          Get-ChildItem 'bridge\build\Release' | Format-Table Name, Length

      # Hand the addon to the ui job: its vitest suite (addonWorker.routing
      # .test.js) forks ui/addon-worker.js, which requires xleth_native.node
      # from bridge/build/Release and needs the DLLs staged above on PATH.
      # The scanner/editor-host exes are NOT included: nothing loads them at
      # addon init, and no current test spawns them.
      - name: Upload bridge addon for the ui job
        uses: actions/upload-artifact@v4
        with:
          name: bridge-addon
          if-no-files-found: error
          path: |
            bridge/build/Release/xleth_native.node
            bridge/build/Release/*.dll

  ui:
    name: UI (Vite build + vitest)
    # The vitest suite loads the native addon (see the download step below),
    # so this job must wait for the native job's artifact.
    needs: native
    runs-on: windows-2022 # pinned to match the native job
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      # Place the addon + its DLLs at the same relative path the test expects
      # (ui/src/addonWorker.routing.test.js points XLETH_BRIDGE_DIR here).
      # Note: `uses` steps ignore the job's working-directory default, so this
      # path is relative to the workspace root.
      - name: Download bridge addon from the native job
        uses: actions/download-artifact@v4
        with:
          name: bridge-addon
          path: bridge/build/Release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci

      # Gating check: the renderer must at least compile.
      - name: Vite production build
        run: npm run build

      # Blocking since Q12: the pre-existing failures were triaged (all stale
      # test expectations or never-committed fixtures) and fixed, so a red
      # vitest result now fails the workflow.
      - name: Vitest
        run: npm test
